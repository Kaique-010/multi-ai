services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --app-dir /app
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    environment:
      COGNE_API_KEY: ${COGNE_API_KEY:?Configure COGNE_API_KEY no .env}
      VECTOR_DATABASE_URL: postgresql+asyncpg://${VECTOR_DB_USER:-app}:${VECTOR_DB_PASSWORD}@banco-vetorial:5432/${VECTOR_DB_NAME:-conhecimento}
      MCP_POSTGRES_URL: ${MCP_POSTGRES_URL:?Configure MCP_POSTGRES_URL no .env}
    volumes:
      - ./backend:/app
    ports:
      - '8001:8000'
    depends_on:
      banco-vetorial:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8001
    ports:
      - '5173:5173'
    depends_on:
      - backend

  banco-vetorial:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${VECTOR_DB_NAME:-conhecimento}
      POSTGRES_USER: ${VECTOR_DB_USER:-app}
      POSTGRES_PASSWORD: ${VECTOR_DB_PASSWORD:?Configure VECTOR_DB_PASSWORD no .env}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - dados_vetoriais:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

  mcp-postgres:
    image: node:20-alpine
    restart: unless-stopped
    environment:
      POSTGRES_URL: postgresql://${VECTOR_DB_USER:-app}:${VECTOR_DB_PASSWORD}@banco-vetorial:5432/${VECTOR_DB_NAME:-conhecimento}
    command: >
      npx -y @modelcontextprotocol/server-postgres
      postgresql://${VECTOR_DB_USER:-app}:${VECTOR_DB_PASSWORD}@banco-vetorial:5432/${VECTOR_DB_NAME:-conhecimento}
    depends_on:
      banco-vetorial:
        condition: service_healthy

volumes:
  dados_vetoriais:
